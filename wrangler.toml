# 奶蛙一跳 · 静态站 + 排行榜后端（Cloudflare Pages）
#
# ───────────────────────────────────────────────────────────────────
# 为什么是 Pages，不是 Workers
#
# 一开始用的是 Workers。部署确实成功了，但它的默认域名 *.workers.dev 在国内
# 整段打不开 —— DNS 被解析成假 IP（Twitter / Facebook 的地址段），TCP 层也被
# 挡，浏览器只会显示「无法访问此网站」。反倒是同一家 Cloudflare 的 Pages
# （*.pages.dev）实测畅通。
#
# 两者底层是同一套运行时（Pages Functions 就是 Workers），所以换过来代价极小：
# 后端业务代码一份没改，只是多了 functions/ 这一层入口。顺带还白赚一条 ——
# 网页和 API 落在同一个域名下，跨域（CORS）整个问题都不存在了。
# ───────────────────────────────────────────────────────────────────
#
# 怎么用这份配置
#
# Cloudflare 控制台 → Workers & Pages → Create → Pages → Connect to Git
#   · 选仓库   Sn2333/naiwa-jump
#   · 项目名   naiwa-jump（决定最终域名 naiwa-jump.pages.dev）
#   · 生产分支 main
#   · 构建配置 不用填 —— 下面的 pages_build_output_dir 会被自动读取
# 保存后它自己就开始构建，几十秒出结果。
#
# ⚠️ 控制台里填的项目名必须和下面的 name 一字不差，否则报 name mismatch。
#
# ⚠️ Cloudflare 把 Workers 和 Pages 放在**同一个命名空间**里，名字不能重复。
#    所以想用 naiwa-jump 这个名字，得先确认没有同名的 Worker 占着。
# ───────────────────────────────────────────────────────────────────

name = "naiwa-jump"
compatibility_date = "2026-09-01"

# 静态资源目录。`.` = 仓库根目录：index.html、js/、assets/ 都在这一层，
# 所以一个文件都不用挪。
# functions/ 是 Cloudflare 的约定目录，会被当成 Pages Functions 处理
# （见 functions/api/[[path]].js），不会作为静态文件发布出去。
#
# 万一控制台没自动读到这行，就在构建设置里手动填：Build output directory = /
pages_build_output_dir = "."

# ───────────────────────────────────────────────────────────────────
# D1 数据库绑定
#
# ⚠️ **必须写在这里，去控制台点是没有用的。**
#
# 这个项目连着 Git 仓库、又有这份配置文件，Cloudflare 就把配置文件当成唯一
# 权威来源（source of truth）。结果是控制台里 Settings → Bindings 的「Add」
# 按钮直接变灰、点不动 —— 不是权限不够，是设计如此：既然每次部署读的都是
# 配置文件，界面就不让改绑定，免得两处配置打架。
#
# 所以拿到 Database ID 后，把下面三行取消注释、填上真值，提交（或网页上传）
# 这份文件，Cloudflare 会自动重新构建，绑定时就生效了。
#
# database_id 在哪拿：
#   控制台 → Workers & Pages → 左侧 D1（有的界面在 Storage & Databases → D1）
#   → 点 naiwa-board → 详情页上的 Database ID，一串 8-4-4-4-12 的十六进制。
#
# naiwa-board 还没建就先建：D1 → Create database，名字填 naiwa-board。
# 表结构不用管 —— 后端第一次收到请求时会自己建（worker/src/index.js 里的
# ensureSchema），worker/schema.sql 只是同一份结构的留档。
#
# 没拿到 id 之前这段保持注释：Worker 照样起得来，只是 /api/health 会返回
# 503 并写清楚「没有绑定 D1」，卡在哪一步一眼能看出来。
#
# 绑好之后一条命令验通没通：
#   node dev/verify_deploy.mjs https://naiwa-jump.pages.dev --write
# ───────────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "naiwa-board"
database_id = "0b8c5a5a-0069-4488-af43-178261e0d9be"

# 奶蛙一跳 · 排行榜后端（Cloudflare Worker + D1）
#
# 这份配置是给「用 wrangler 命令行部署」的人准备的。
# 如果你走控制台复制粘贴那条路（更简单，不用装任何东西），可以完全无视这个文件 ——
# 绑定关系在控制台的 Worker → Settings → Bindings 里点几下就行。
#
# 用 wrangler 的流程：
#   cd worker
#   npx wrangler login
#   npx wrangler d1 create naiwa-board        # 建库，把输出的 database_id 填到下面
#   npx wrangler deploy
#   npx wrangler d1 execute naiwa-board --remote --file=schema.sql   # 可选，Worker 会自己建表

name = "naiwa-jump-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 变量名必须是 DB —— worker/src/index.js 里用的是 env.DB
[[d1_databases]]
binding = "DB"
database_name = "naiwa-board"
database_id = "把 wrangler d1 create 输出的 id 填到这里"
